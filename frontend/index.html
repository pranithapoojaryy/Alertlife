<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="app-favicon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" id="app-manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" id="app-theme-color" content="#6366f1" />
    <title>Alert Life - Emergency SOS</title>
    <script>
      try {
        var params = new URLSearchParams(window.location.search);
        var isVolunteer = params.get('portal') === 'volunteer' || window.location.pathname.indexOf('volunteer') !== -1;
        if (isVolunteer) {
          document.title = 'Alert Responder - Volunteer First Responder';
          var favicon = document.getElementById('app-favicon') || document.querySelector("link[rel~='icon']");
          if (favicon) favicon.href = '/volunteer-icon.svg';
          var manifest = document.getElementById('app-manifest') || document.querySelector("link[rel='manifest']");
          if (manifest) manifest.href = '/manifest-volunteer.json';
          var themeColor = document.getElementById('app-theme-color') || document.querySelector("meta[name='theme-color']");
          if (themeColor) themeColor.setAttribute('content', '#10b981');
        }
      } catch(e) {
        console.warn('Portal initialization script safe pass:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              console.log('PWA ServiceWorker registered & updated:', reg.scope);
            })
            .catch(err => console.log('PWA ServiceWorker registration failed:', err));
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
